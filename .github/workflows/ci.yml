# Intégration continue de MicroCRM : build, tests et analyse SonarQube Cloud du back et du front.
# Les actions sont fixées par SHA de commit (un tag peut être déplacé) ; la version figure en commentaire.
# Un jeton SonarQube par projet (SONAR_TOKEN_BACK, SONAR_TOKEN_FRONT) : chacun ne permet d'analyser que son projet.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * *" # chaque nuit, 02:23 UTC, sur main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    name: Back (Gradle, JUnit, JaCoCo, Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: back
    env:
      # Seulement un booléen : le jeton lui-même n'est exposé qu'à l'étape d'analyse
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : Sonar s'en sert pour attribuer le nouveau code
          persist-credentials: false

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Build, tests et couverture
        run: ./gradlew build

      - name: Analyse SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true' # absent sur les PR de forks et de Dependabot
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_BACK }}
        run: ./gradlew sonar -Dsonar.qualitygate.wait=true

      - name: Rapports de tests et de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: back-rapports
          path: |
            back/build/reports/tests/test
            back/build/reports/jacoco/test
          retention-days: 14

  front:
    name: Front (npm, Karma, lcov, Sonar)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: front
    env:
      # Seulement un booléen : le jeton lui-même n'est exposé qu'à l'étape d'analyse
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: Tests et couverture
        run: npm run test:ci

      - name: Build de production
        run: npm run build

      - name: Analyse SonarQube Cloud
        if: env.HAS_SONAR_TOKEN == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          projectBaseDir: front
          args: -Dsonar.qualitygate.wait=true

      - name: Rapport de couverture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: front-couverture
          path: front/coverage/microcrm
          retention-days: 14
