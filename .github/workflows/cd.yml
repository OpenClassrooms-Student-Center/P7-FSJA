name: CD
on:
  # Déclenchement manuel ou via tag SemVer
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

env:
  # Registry GitHub Container Registry
  REGISTRY: ghcr.io

jobs:
  publish-images:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Récupère le code
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR exige un nom de repo en minuscules
      - name: Set lowercase owner
        id: owner_lc
        run: echo "owner_lc=$(echo ${GITHUB_REPOSITORY_OWNER} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # Buildx pour le build multi-arch si besoin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Login au registre GHCR
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Grant execute permission for Gradle wrapper
      - name: Accorder les permissions d'exécution au wrapper Gradle
        run: chmod +x ./gradlew

      # Construire et pousser l'image Docker du backend
      - name: Construire et Pousser l'image Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: back
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner_lc.outputs.owner_lc }}/orion-microcrm-back:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner_lc.outputs.owner_lc }}/orion-microcrm-back:latest

      # Build & push image front
      - name: Build & Push Front image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: front
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.owner_lc.outputs.owner_lc }}/orion-microcrm-front:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.owner_lc.outputs.owner_lc }}/orion-microcrm-front:latest

      # Add SonarCloud analysis step
      - name: Run SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
